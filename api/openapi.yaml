components:
  schemas:
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 10000
        category_id:
          type: string
        price_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000
        status:
          type: string
          enum:
            - draft
            - published
            - withdrawn
        version:
          type: integer
          format: int64
          minimum: 1
        created_at:
          type: string
          format: date-time
        photos:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              url:
                type: string
                format: uri-reference
            required:
              - id
          nullable: true
      required:
        - id
        - owner_id
        - title
        - description
        - category_id
        - price_minor
        - status
        - version
        - created_at
        - photos
    ListingInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 10000
        category_id:
          type: string
        price_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000000000
      required:
        - title
        - description
        - category_id
        - price_minor
    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri-reference
      required:
        - id
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
      required:
        - id
        - name
    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        listing_id:
          type: string
          format: uuid
        buyer_id:
          type: string
          format: uuid
        seller_id:
          type: string
          format: uuid
        title:
          type: string
        updated_at:
          type: string
          format: date-time
        peer_name:
          type: string
        last_message:
          type: string
      required:
        - id
        - listing_id
        - buyer_id
        - seller_id
        - title
        - updated_at
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
          minimum: 1
        conversation_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 4000
        created_at:
          type: string
          format: date-time
      required:
        - id
        - seq
        - conversation_id
        - sender_id
        - body
        - created_at
    Session:
      type: object
      properties:
        access_token:
          type: string
      required:
        - access_token
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
          required:
            - code
            - message
        request_id:
          type: string
      required:
        - error
        - request_id
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT EdDSA
    service:
      type: http
      scheme: bearer
      description: SERVICE_TOKEN, отдельный от пользовательского JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh
  responses:
    Error:
      description: Ошибка запроса; code стабилен, message предназначен пользователю
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
