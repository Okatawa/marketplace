services:
  accounts:
    environment: &tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
  listings:
    environment: *tracing
  search:
    environment: *tracing
  messaging:
    environment: *tracing
  notifications:
    environment: *tracing
  gateway:
    environment: *tracing
  otel:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./deploy/observability/otel-collector.yaml:/etc/otel/config.yaml:ro"]
    depends_on: [jaeger]
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["127.0.0.1:16686:16686"]
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./deploy/observability/alerts.yaml:/etc/prometheus/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:19090:9090"]
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Keep the bundled Prometheus plugin; startup updates can unregister it
      # while waiting for an external download and break all dashboard queries.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?run make setup}
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
volumes:
  prometheus-data:
