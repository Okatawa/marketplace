global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: marketplace
    static_configs:
      - targets: ["gateway:9090"]
        labels: {service: gateway}
      - targets: ["accounts:9090"]
        labels: {service: accounts}
      - targets: ["listings:9090"]
        labels: {service: listings}
      - targets: ["search:9090"]
        labels: {service: search}
      - targets: ["messaging:9090"]
        labels: {service: messaging}
      - targets: ["notifications:9090"]
        labels: {service: notifications}
